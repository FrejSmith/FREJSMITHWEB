<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservations - FrejSmithWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo">
                        <img src="images/fsw.png" alt="FrejSmithWeb Logo">
                    </div>
                    <h1>FrejSmithWeb</h1>
                </div>
                <nav class="nav">
                    <a href="index.html">Accueil</a>
                    <a href="about.html">À propos</a>
                    <a href="services.html">Services</a>
                    <a href="portfolio.html">Portfolio</a>
                    <a href="reviews.html">Avis</a>
                    <a href="reservations.html">Réservations</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="contact-full">
        <div class="container">
            <h2>Demande de réservation</h2>
            <p>Réservez une session de conseil ou un projet personnalisé.</p>
            <div class="contact-content">
                <div class="contact-form">
                    <form id="reservationForm">
                        <div class="form-group">
                            <label for="name">Nom</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Téléphone</label>
                            <input type="text" id="phone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="service">Service souhaité</label>
                            <select id="service" name="service" required>
                                <option value="">Choisir...</option>
                                <option value="Développement Web">Développement Web</option>
                                <option value="Application mobile">Application mobile</option>
                                <option value="Consulting">Consulting</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Date souhaitée</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Heure souhaitée</label>
                            <input type="time" id="time" name="time" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5"></textarea>
                        </div>
                        <div id="formMessage" class="form-message"></div>
                        <button type="submit" class="btn btn-primary">Envoyer la réservation</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FrejSmithWeb. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="reservation.js"></script>
    <script src="tracker.js"></script>
</body>
</html>
