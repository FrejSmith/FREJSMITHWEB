</head>
<body data-page-title-key="page_title_contact">
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo">
                        <img src="images/fsw.png" alt="FrejSmithWeb Logo">
                    </div>
                    <h1>FrejSmithWeb</h1>
                </div>
                <nav class="nav">
                    <a href="index.html" data-i18n="nav_home">Accueil</a>
                    <a href="agences.html" data-i18n="nav_agences">Agences</a>
                    <div class="nav-dropdown">
                        <a href="#offres" data-i18n="nav_domaines">Domaines d'expertises</a>
                        <div class="dropdown-menu">
                            <a href="service.php?service=site-internet">Création de Site Internet</a>
                            <a href="service.php?service=application-web">Application Web</a>
                            <a href="service.php?service=seo">Référencement SEO</a>
                            <a href="service.php?service=ux-ui">UX/UI Design</a>
                            <a href="service.php?service=graphisme">Graphisme</a>
                            <a href="service.php?service=maintenance">Maintenance et Support</a>
                        </div>
                    </div>
                    <a href="index.html#realisations" data-i18n="nav_refer">Références</a>
                    <a href="blog.html" data-i18n="nav_blog">Blog</a>
                    <a href="contact.html" data-i18n="nav_contact">Contactez-nous</a>
                    <div class="lang-switcher">
                        <select id="languageSelector" aria-label="Langue">
                            <option value="fr">FR</option>
                            <option value="en">EN</option>
                            <option value="es">ES</option>
                            <option value="de">DE</option>
                        </select>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contact Content -->
    <section class="contact-full">
        <div class="container">
                <h2 data-i18n="contact_title">Contactez-moi</h2>
                <p data-i18n="contact_subtitle">Prêt à discuter de votre projet ?</p>
            <div class="contact-content">
                <div class="contact-image">
                    <img src="https://via.placeholder.com/500x400?text=Contact+Us" alt="Contact">
                </div>
                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name" data-i18n="label_name">Nom</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email" data-i18n="label_email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="subject" data-i18n="label_subject">Sujet</label>
                            <input type="text" id="subject" name="subject" required>
                        </div>
                        <div class="form-group">
                            <label for="message" data-i18n="label_message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <div id="formMessage" class="form-message"></div>
                        <button type="submit" class="btn btn-primary" data-i18n="btn_send">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 FrejSmithWeb. Tous droits réservés.</p>
        </div>

</body>
