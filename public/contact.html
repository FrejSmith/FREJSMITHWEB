<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - FrejSmithWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo">
                        <img src="images/fsw.png" alt="FrejSmithWeb Logo">
                    </div>
                    <h1>FrejSmithWeb</h1>
                </div>
                <nav class="nav">
                    <a href="index.html">Accueil</a>
                    <a href="about.html">À propos</a>
                    <a href="services.html">Services</a>
                    <a href="portfolio.html">Portfolio</a>
                    <a href="reviews.html">Avis</a>
                    <a href="reservations.html">Réservations</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contact Content -->
    <section class="contact-full">
        <div class="container">
            <h2>Contactez-moi</h2>
            <p>Prêt à discuter de votre projet ?</p>
            <div class="contact-content">
                <div class="contact-image">
                    <img src="https://via.placeholder.com/500x400?text=Contact+Us" alt="Contact">
                </div>
                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Nom</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">Sujet</label>
                            <input type="text" id="subject" name="subject" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <div id="formMessage" class="form-message"></div>
                        <button type="submit" class="btn btn-primary">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 FrejSmithWeb. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="carousel.js"></script>
    <script src="contact.js"></script>
</body>
</html>
