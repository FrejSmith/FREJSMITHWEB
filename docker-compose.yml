version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: frejsmithweb
      DB_USER: root
      DB_PASS: "Gbotounousmith1992@@@"
      ADMIN_USER: admin
      ADMIN_PASS: ChangeMe123!

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Gbotounousmith1992@@@"
      MYSQL_DATABASE: frejsmithweb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "Gbotounousmith1992@@@"

volumes:
  db_data:
